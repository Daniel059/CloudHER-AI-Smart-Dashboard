<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudHER | Page Not Found</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            font-family: Arial, Helvetica, sans-serif;
            color: #f8fafc;
            background:
                radial-gradient(circle at top left, #243b55, transparent 40%),
                #0b1120;
        }

        .error-card {
            max-width: 650px;
            text-align: center;
            padding: 55px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 24px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
        }

        .badge {
            color: #38bdf8;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 72px;
            margin: 20px 0 5px;
            color: #38bdf8;
        }

        h2 { margin-bottom: 15px; }

        p {
            color: #94a3b8;
            line-height: 1.7;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 22px;
            border-radius: 10px;
            background: #38bdf8;
            color: #082f49;
            text-decoration: none;
            font-weight: bold;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>

<body>
    <main class="error-card">
        <div class="badge">CLOUDHER • FINAL MILESTONE PROJECT</div>
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>
            The cloud couldn't find the page you're looking for.
            The requested resource may have moved or does not exist.
        </p>
        <a href="index.html">← Return to Dashboard</a>
        <div class="footer">CloudHER AI Smart Dashboard • AWS CloudFormation Project</div>
    </main>
</body>
</html>
